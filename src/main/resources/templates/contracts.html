<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt">
<head th:replace="~{fragments/shell :: head('Contracts')}"></head>
<body>
<svg th:replace="~{fragments/shell :: icons}"></svg>
<div class="app">
  <aside th:replace="~{fragments/shell :: sidebar('contracts')}"></aside>
  <div class="main">
    <header th:replace="~{fragments/shell :: topbar('Contracts')}"></header>
    <main class="content">
      <div class="page-head">
        <div><h1>Contracts</h1><p>Contracts with approved vendors. A contract becomes active only after its full approval flow is completed.</p></div>
        <div class="actions"><a class="btn primary" th:if="${canManageContracts}" th:href="@{/contracts/new}"><svg class="ic"><use href="#i-plus"/></svg>New contract</a></div>
      </div>
      <div class="card flush">
        <form class="toolbar" method="get" th:action="@{/contracts}">
          <input class="search" type="search" name="q" th:value="${q}" placeholder="Search by contract number, title or vendor">
          <select name="status" onchange="this.form.submit()">
            <option value="">All statuses</option>
            <option th:each="s : ${ {'DRAFT','IN_APPROVAL','ACTIVE','REJECTED','TERMINATED','CLOSED','EXPIRING'} }" th:value="${s}" th:selected="${s == status}"
                    th:text="${s == 'EXPIRING' ? 'Expiring soon' : #strings.capitalizeWords(#strings.toLowerCase(#strings.replace(s, '_', ' ')))}">Draft</option>
          </select>
          <button class="btn" type="submit">Search</button>
          <span class="muted mono" th:text="${result.total} + ' contract(s)'"></span>
        </form>
        <div class="table-wrap"><table>
          <thead><tr><th>Number</th><th>Title</th><th>Vendor</th><th>Service area</th><th>Value</th><th>Start</th><th>End</th><th>Status</th><th></th></tr></thead>
          <tbody>
            <tr th:each="c : ${result.rows}">
              <td class="mono" th:text="${c.number}">CTR-2026-00001</td>
              <td class="name"><a th:href="@{/contracts/{id}(id=${c.id})}" th:text="${c.title}" style="color:inherit">Title</a></td>
              <td><a th:href="@{/vendors/{id}(id=${c.vendorId})}" th:text="${c.vendorName}">Vendor</a></td>
              <td th:text="${c.serviceArea}"></td>
              <td th:text="${c.amount != null} ? ${#numbers.formatDecimal(c.amount, 1, 'COMMA', 2, 'POINT')} + ' ' + ${c.currency} : '—'"></td>
              <td th:text="${#temporals.format(c.startDate, 'dd/MM/yyyy')}"></td>
              <td th:text="${#temporals.format(c.endDate, 'dd/MM/yyyy')}"></td>
              <td><span th:replace="~{fragments/shell :: status(${c.status})}"></span></td>
              <td><a th:href="@{/contracts/{id}(id=${c.id})}">View</a></td>
            </tr>
            <tr th:if="${result.total == 0}"><td colspan="9" class="empty">No contracts found.</td></tr>
          </tbody></table></div>
        <div class="pager">
          <span th:text="'Showing ' + ${result.from} + '–' + ${result.to} + ' of ' + ${result.total} + ' contracts'"></span>
          <div class="pages">
            <a th:if="${result.page > 1}" th:href="@{/contracts(q=${q},status=${status},page=${result.page - 1})}">Previous</a>
            <span class="off" th:if="${result.page <= 1}">Previous</span>
            <span class="cur" th:text="${result.page}">1</span>
            <a th:if="${result.page < result.pages}" th:href="@{/contracts(q=${q},status=${status},page=${result.page + 1})}">Next</a>
            <span class="off" th:if="${result.page >= result.pages}">Next</span>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<th:block th:replace="~{fragments/shell :: scripts}"></th:block>
</body>
</html>
